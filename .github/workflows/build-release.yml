name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank to use v<package.json version>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            script: dist:win
          - label: macOS
            os: macos-latest
            script: dist:mac
          - label: Linux
            os: ubuntu-latest
            script: dist:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm install --no-save electron@^45.1.0 electron-builder@^26.18.0

      - name: Ensure app icon exists
        shell: bash
        run: |
          mkdir -p build
          if [ ! -f build/icon.png ]; then cp electron/icon.png build/icon.png; fi

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }}

      - name: Upload built installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            release/Folio-Setup.exe
            release/Folio-Portable.exe
            release/Folio-mac.dmg
            release/Folio-linux-amd64.deb
            release/Folio-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Folio ${TAG}" \
              --notes "Built automatically via GitHub Actions with Word Count, Multi-Tab PDFs, and Gemini support." \
              --latest
          fi
